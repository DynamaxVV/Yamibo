name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: yamibo
          POSTGRES_USER: yamibo
          POSTGRES_PASSWORD: yamibo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yamibo -d yamibo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      YAMIBO_TEST_PG_URL: postgresql+psycopg://yamibo:yamibo@127.0.0.1:5432/yamibo
      YAMIBO_TEST_PG_ISOLATED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: c/package-lock.json
      - run: npm ci
        working-directory: c
      - run: npm run build
        working-directory: c

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: yamibo-archiver:ci
