[project]
name = "yamibo-archiver"
version = "1.1.0"
description = "百合会归档助手 — 本地论坛归档 MCP server, daemon, and web console."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27.2",
  "sqlalchemy>=2.0.0",
  "psycopg[binary,pool]>=3.1.0",
  "pgvector>=0.3.0",
  "alembic>=1.13.0",
  "curl-cffi>=0.7.0",
  "playwright>=1.62.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "testcontainers[postgres]>=4.0.0",
  "sqlite-vec",
]

[project.scripts]
yamibo-init-db = "yamibo_mcp.db.migrations:main"
yamibo-daemon = "yamibo_mcp.daemon.main:main"
yamibo-web = "yamibo_mcp.web_fastapi.app:main"
yamibo-archiver = "yamibo_mcp.server.cli:main"
yamibo-backup-db = "yamibo_mcp.maintenance.backup_db:main"
yamibo-maintenance-cleanup = "yamibo_mcp.maintenance.cleanup_data:main"
yamibo-reset-data = "yamibo_mcp.maintenance.reset_data:main"
yamibo-reclassify-errors = "yamibo_mcp.maintenance.reclassify_errors:main"
yamibo-rag-anime-materialize = "yamibo_mcp.rag.anime_materializer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yamibo_mcp" = ["py.typed"]
"yamibo_mcp.web" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
