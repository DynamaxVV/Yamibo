[project]
name = "yamibo-mcp"
version = "0.1.0"
description = "Local Yamibo archiving MCP server, worker, and web console."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
yamibo-init-db = "yamibo_mcp.db.migrations:main"
yamibo-worker = "yamibo_mcp.worker.main:main"
yamibo-web = "yamibo_mcp.web.app:main"
yamibo-mcp-server = "yamibo_mcp.server.app:main"
yamibo-backup-db = "yamibo_mcp.maintenance.backup_db:main"
yamibo-maintenance-cleanup = "yamibo_mcp.maintenance.cleanup_data:main"
yamibo-reset-data = "yamibo_mcp.maintenance.reset_data:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
